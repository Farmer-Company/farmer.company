name: Deploy to Cloudflare

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Deploy with Wrangler
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: cfat_UxHOMDxiSaAf4gZ94QZoOKFSudJFrNr4hlB7T4pK7944c83e
          CLOUDFLARE_ACCOUNT_ID: 546b4dcb9ec5801ea9f846776d8ca88c
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
