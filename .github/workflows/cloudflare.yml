name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: cfat_CNNl1qoD5TemXHJWmoGQw3cJ7yhMJ9fu5cGsKDWu1a5202e4
          accountId: 546b4dcb9ec5801ea9f846776d8ca88c
          projectName: farmercompany
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
